    version: "3.8"
    services:
      minimserver:
        image: minimworld/minimserver:latest
        container_name: minimserver
        hostname: minimserver
        ports:
          - "9790:9790"
        volumes:
          - /path/to/your/music:/Music:ro
          - minimserver_data:/opt/minimserver
        restart: unless-stopped
        network_mode: host
        environment:
          TZ: "Europe/London" # Adjust to your timezone

    volumes:
      minimserver_data:
