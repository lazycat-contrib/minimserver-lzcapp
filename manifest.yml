lzc-sdk-version: "0.1"
name: MinimServer
package: cloud.lazycat.app.minimserver
version: 2.2.0
description: 一个UPnP Audio Server
homepage: https://minimserver.com/index.html
author: minimserver
application:
  subdomain: minimserver
  background_task: true
  multi_instance: true
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  routes:
    - /=http://minimserver.cloud.lazycat.app.minimserver.lzcapp:9790/
services:
  minimserver:
    image: registry.lazycat.cloud/czyt/minimworld/minimserver:48de01ed32dbce65
    environment:
      - TZ=Asia/Beijing
    ingress:
      - protocol: tcp
        port: 9791
        service: minimserver
    network_mode: host
    binds:
      - /lzcapp/run/mnt/home/Music:/Music
      - /lzcapp/var/data:/opt/minimserver/data
unsupported_platforms:
  - ios
  - android
