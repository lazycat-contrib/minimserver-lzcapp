version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/minimserver.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: minimserver
build:
  run_buildscript: false
images:
  - id: minimserver
    target: service
    service: minimserver
    source: minimworld/minimserver
    channel: custom
    sort: semver
    tag_regex: '^\d+\.\d+$'
    version_regex: '^(?P<version>\d+\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: MinimServer
    summary: "一个UPnP Audio Server"
